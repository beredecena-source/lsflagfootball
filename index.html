: inherit; cursor: pointer; } :focus-visible{  outline: 3px solid var(--red);  outline-offset: 2px;} @media (prefers-reduced-motion: reduce){  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }} .container{  width: 100%;  max-width: var(--container);  margin: 0 auto;  padding: 0 24px;} .kicker{  font-family: var(--font-mono);  font-size: 12px;  letter-spacing: 0.14em;  text-transform: uppercase;  color: var(--navy-tint);  font-weight: 500;  display: inline-flex;  align-items: center;  gap: 8px;  margin-bottom: 14px;}.kicker::before{  content: "";  width: 20px;  height: 2px;  background: var(--red);  display: inline-block;} .mono-stat{  font-family: var(--font-mono);  font-variant-numeric: tabular-nums;  font-weight: 500;} /* ---------- Botones ---------- */.btn{  display: inline-flex;  align-items: center;  justify-content: center;  gap: 8px;  padding: 14px 28px;  border-radius: var(--radius-sm);  font-family: var(--font-body);  font-weight: 600;  font-size: 15px;  border: 2px solid transparent;  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;  white-space: nowrap;}.btn:hover{ transform: translateY(-2px); }.btn--red{ background: var(--red); color: var(--white); }.btn--red:hover{ background: var(--red-dark); box-shadow: var(--shadow-md); }.btn--outline{ background: transparent; border-color: rgba(255,255,255,0.55); color: var(--white); }.btn--outline:hover{ border-color: var(--white); background: rgba(255,255,255,0.08); }.btn--navy{ background: var(--navy); color: var(--white); }.btn--navy:hover{ background: var(--navy-tint); }.btn--block{ width: 100%; }.btn:disabled{ opacity: 0.5; cursor: not-allowed; transform: none; } /* ---------- Nav ---------- */.nav{  position: sticky;  top: 0;  z-index: 100;  background: var(--navy);  border-bottom: 1px solid rgba(255,255,255,0.08);}.nav__inner{  display: flex;  align-items: center;  justify-content: space-between;  height: 76px;}.nav__brand{  display: flex;  align-items: center;  gap: 10px;  color: var(--white);}.nav__logo-img{ height: 52px; width: auto; display: block; }@media (max-width: 480px){ .nav__logo-img{ height: 42px; } } .nav__links{  display: flex;  align-items: center;  gap: 28px;}.nav__links a{  font-size: 14px;  font-weight: 600;  color: rgba(255,255,255,0.75);  padding: 8px 2px;  border-bottom: 2px solid transparent;  transition: color 0.15s ease, border-color 0.15s ease;}.nav__links a:hover{ color: var(--white); }.nav__links a.is-active{ color: var(--white); border-bottom-color: var(--red); } .nav__actions{ display: flex; align-items: center; gap: 14px; }.nav__toggle{  display: none;  background: transparent;  border: 1px solid rgba(255,255,255,0.3);  border-radius: var(--radius-sm);  width: 44px;  height: 44px;  color: var(--white);  font-size: 20px;} @media (max-width: 900px){  .nav__links{    position: absolute;    top: 76px;    left: 0;    right: 0;    background: var(--navy);    flex-direction: column;    align-items: flex-start;    gap: 0;    padding: 8px 24px 20px;    display: none;    border-bottom: 1px solid rgba(255,255,255,0.08);  }  .nav__links.is-open{ display: flex; }  .nav__links a{ width: 100%; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }  .nav__links a.is-active{ border-bottom-color: rgba(255,255,255,0.08); }  .nav__toggle{ display: inline-flex; align-items: center; justify-content: center; }  .nav__actions .btn{ display: none; }} /* ---------- Hero ---------- */.hero{  background: var(--navy);  color: var(--white);  position: relative;  overflow: hidden;  padding: 88px 0 96px;}.hero--page{ padding: 64px 0 72px; }.hero__star{  position: absolute;  right: -60px;  top: -60px;  width: 420px;  height: 420px;  opacity: 0.06;  pointer-events: none;}.hero__content{ position: relative; max-width: 700px; }.hero h1{ color: var(--white); font-size: clamp(34px, 5.4vw, 58px); margin-bottom: 20px; }.hero__lede{ font-size: 18px; color: rgba(255,255,255,0.82); max-width: 560px; margin-bottom: 32px; }.hero__accent-rule{ width: 64px; height: 4px; background: var(--red); margin-bottom: 24px; }.hero__cta{ display: flex; gap: 16px; flex-wrap: wrap; }.hero__meta{  display: flex;  gap: 32px;  margin-top: 48px;  flex-wrap: wrap;}.hero__meta-item .mono-stat{ display: block; font-size: 26px; color: var(--red); }.hero__meta-item span:last-child{ display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.65); margin-top: 2px; } /* ---------- Secciones ---------- */.section{ padding: 84px 0; }.section--alt{ background: var(--chalk); }.section--navy{ background: var(--navy); color: var(--white); }.section--navy h2{ color: var(--white); }.section__head{ max-width: 640px; margin-bottom: 48px; }.section__head--center{ margin-left: auto; margin-right: auto; text-align: center; }.section h2{ font-size: clamp(26px, 3.4vw, 38px); margin-bottom: 14px; }.section__lede{ font-size: 17px; color: var(--slate); }.section--navy .section__lede{ color: rgba(255,255,255,0.75); } /* ---------- Tarjetas ---------- */.grid{ display: grid; gap: 24px; }.grid--2{ grid-template-columns: repeat(2, 1fr); }.grid--3{ grid-template-columns: repeat(3, 1fr); }.grid--4{ grid-template-columns: repeat(4, 1fr); }@media (max-width: 900px){  .grid--3, .grid--4{ grid-template-columns: repeat(2, 1fr); }}@media (max-width: 620px){  .grid--2, .grid--3, .grid--4{ grid-template-columns: 1fr; }} .card{  background: var(--white);  border: 1px solid var(--border);  border-radius: var(--radius);  padding: 28px;}.card__icon{  width: 44px;  height: 44px;  border-radius: 10px;  background: rgba(228,0,27,0.08);  color: var(--red);  display: flex;  align-items: center;  justify-content: center;  margin-bottom: 18px;}.card__icon svg{ width: 22px; height: 22px; }.card h3{ font-size: 18px; text-transform: none; margin-bottom: 10px; letter-spacing: 0; }.card p{ color: var(--slate); font-size: 15px; }.card--navy{ background: var(--navy-tint); border-color: transparent; color: var(--white); }.card--navy h3{ color: var(--white); }.card--navy p{ color: rgba(255,255,255,0.78); }.card--navy .card__icon{ background: rgba(228,0,27,0.20); color: var(--red); } .card__cta{ margin-top: 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--red); } /* ---------- Precio ---------- */.price-card{  background: var(--red);  border-radius: var(--radius-lg);  padding: 40px 36px;  color: var(--white);}.price-card__label{ font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; opacity: 0.85; }.price-card__value{ font-family: var(--font-mono); font-size: 58px; font-weight: 500; line-height: 1; margin-bottom: 4px; }.price-card__unit{ font-size: 15px; font-weight: 600; margin-bottom: 18px; }.price-card__note{ font-size: 14px; color: rgba(255,255,255,0.82); margin-bottom: 20px; } .price-table{ width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }.price-table th, .price-table td{ text-align: left; padding: 18px 22px; border-bottom: 1px solid var(--border); }.price-table th{ font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); background: var(--chalk); }.price-table td:last-child, .price-table th:last-child{ font-family: var(--font-mono); font-weight: 500; color: var(--navy); text-align: right; }.price-table tr:last-child td{ border-bottom: none; } /* ---------- Stats ---------- */.stats-strip{ display: grid; grid-template-columns: repeat(4,1fr); gap: 24px; }@media (max-width: 760px){ .stats-strip{ grid-template-columns: repeat(2,1fr); } }.stat{ text-align: left; padding: 20px 0; border-top: 2px solid var(--red); }.stat__value{ font-family: var(--font-mono); font-size: 32px; color: var(--navy); display: block; }.section--navy .stat__value{ color: var(--red); }.stat__label{ font-size: 14px; color: var(--slate); margin-top: 4px; display: block; }.section--navy .stat__label{ color: rgba(255,255,255,0.7); } /* ---------- Placeholder ---------- */.ph{  display: inline-block;  font-family: var(--font-mono);  font-size: 12.5px;  color: var(--slate);  background: rgba(91,100,114,0.08);  border: 1px dashed var(--slate-light);  border-radius: 6px;  padding: 2px 8px;} /* ---------- Pasos / listas numeradas ---------- */.steps{ counter-reset: step; display: grid; gap: 18px; }.step{  display: flex;  gap: 18px;  align-items: flex-start;  padding: 20px;  background: var(--white);  border: 1px solid var(--border);  border-radius: var(--radius);}.step__num{  font-family: var(--font-mono);  font-size: 15px;  color: var(--navy);  background: var(--chalk);  border: 2px solid var(--red);  width: 34px; height: 34px;  border-radius: 50%;  display: flex; align-items: center; justify-content: center;  flex-shrink: 0;}.step h4{ text-transform: none; font-size: 16px; letter-spacing: 0; margin-bottom: 4px; }.step p{ color: var(--slate); font-size: 14.5px; } /* ---------- CTA final ---------- */.cta-final{  background: var(--navy);  color: var(--white);  border-radius: var(--radius-lg);  padding: 56px;  position: relative;  overflow: hidden;}.cta-final h2{ color: var(--white); }.cta-final__meta{ display: flex; gap: 28px; flex-wrap: wrap; margin: 28px 0 32px; }.cta-final__meta-item{ display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: rgba(255,255,255,0.85); }.cta-final__meta-item .dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; } /* ---------- Formularios ---------- */.form{ display: grid; gap: 18px; }.form-row{ display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }@media (max-width: 620px){ .form-row{ grid-template-columns: 1fr; } }.field label{ display: block; font-size: 13.5px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }.field input, .field select, .field textarea{  width: 100%;  padding: 12px 14px;  border: 1.5px solid var(--border);  border-radius: var(--radius-sm);  font-family: var(--font-body);  font-size: 15px;  background: var(--white);  color: var(--ink);}.field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--red); outline: none; box-shadow: 0 0 0 3px rgba(228,0,27,0.14); }.field small{ display: block; margin-top: 5px; font-size: 12.5px; color: var(--slate-light); }.field.has-error input, .field.has-error select{ border-color: #C0392B; }.field__error{ color: #C0392B; font-size: 12.5px; margin-top: 5px; display: none; }.field.has-error .field__error{ display: block; } .btn--outline-navy{ background: transparent; border-color: var(--border); color: var(--navy); }.btn--outline-navy:hover{ border-color: var(--navy); background: var(--chalk); } .program-option{  display: flex;  align-items: center;  gap: 12px;  border: 1.5px solid var(--border);  border-radius: var(--radius-sm);  padding: 14px 16px;  cursor: pointer;  transition: border-color 0.15s ease, background 0.15s ease;}.program-option:has(input:checked){ border-color: var(--red); background: rgba(228,0,27,0.05); }.program-option input{ width: 18px; height: 18px; accent-color: var(--red); flex-shrink: 0; }.program-option span{ display: flex; flex-direction: column; }.program-option strong{ font-size: 14.5px; color: var(--navy); }.program-option small{ font-family: var(--font-mono); font-size: 13px; color: var(--slate); } /* ---------- Registration Wizard ---------- */.wizard{ background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }.wizard__progress{ display: flex; background: var(--chalk); border-bottom: 1px solid var(--border); }.wizard__progress-step{  flex: 1;  padding: 16px 10px;  text-align: center;  font-family: var(--font-mono);  font-size: 12px;  letter-spacing: 0.05em;  color: var(--slate-light);  border-bottom: 3px solid transparent;}.wizard__progress-step.is-active{ color: var(--navy); border-bottom-color: var(--red); font-weight: 600; }.wizard__progress-step.is-done{ color: var(--success); }.wizard__body{ padding: 36px; }.wizard__panel{ display: none; }.wizard__panel.is-active{ display: block; }.wizard__nav{ display: flex; justify-content: space-between; margin-top: 28px; }.wizard__summary{ background: var(--chalk); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 22px; }.wizard__summary-row{ display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; }.wizard__summary-row:last-child{ border-bottom: none; font-weight: 700; color: var(--navy); }.wizard__success{ text-align: center; padding: 20px 0; }.wizard__success-icon{ width: 56px; height: 56px; border-radius: 50%; background: var(--success-bg); color: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }.wizard__note{ font-size: 13px; color: var(--slate-light); margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border); } /* ---------- Footer ---------- */.footer{ background: var(--navy-dark); color: rgba(255,255,255,0.75); padding: 64px 0 32px; }.footer__grid{ display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; margin-bottom: 48px; }@media (max-width: 760px){ .footer__grid{ grid-template-columns: 1fr 1fr; } }.footer__brand{ margin-bottom: 14px; }.footer__logo-img{ height: 44px; width: auto; display: block; }.footer__desc{ font-size: 14px; max-width: 280px; color: rgba(255,255,255,0.6); }.footer h5{ font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 14px; font-weight: 500; }.footer ul li{ margin-bottom: 10px; }.footer a{ font-size: 14.5px; color: rgba(255,255,255,0.78); }.footer a:hover{ color: var(--red); }.footer__bottom{ border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; color: rgba(255,255,255,0.45); } /* ---------- Utilidades ---------- */.mt-0{ margin-top: 0; }.text-center{ text-align: center; }.badge{ display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(228,0,27,0.08); color: var(--red); }.two-col{ display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: start; }@media (max-width: 860px){ .two-col{ grid-template-columns: 1fr; } }.divider{ height: 1px; background: var(--border); margin: 64px 0; }.map-placeholder{  background: var(--chalk);  border: 1.5px dashed var(--border);  border-radius: var(--radius);  min-height: 260px;  display: flex;  align-items: center;  justify-content: center;  color: var(--slate-light);  font-family: var(--font-mono);  font-size: 13px;  text-align: center;  padding: 24px;}  /* ---------- Menú principal: Programs / Locations ---------- */.nav-dropdown{position:relative;}.nav-dropdown__main{display:inline-flex!important;align-items:center;gap:5px;}.nav-dropdown__main span{font-size:11px;opacity:.8;}.nav-dropdown__menu{  position:absolute;  top:100%;  left:0;  min-width:205px;  background:var(--white);  border-radius:var(--radius-sm);  box-shadow:var(--shadow-md);  padding:8px 0;  display:none;  z-index:300;  border:1px solid var(--border);}.nav-dropdown:hover .nav-dropdown__menu,.nav-dropdown:focus-within .nav-dropdown__menu,.nav-dropdown.is-open .nav-dropdown__menu{display:block;}.nav-dropdown__menu a{  display:block!important;  width:100%;  padding:11px 17px!important;  color:var(--navy)!important;  border:0!important;  font-size:14px!important;  white-space:nowrap;}.nav-dropdown__menu a:hover,.nav-dropdown__menu a:focus{  color:var(--red)!important;  background:var(--chalk);}@media (max-width:900px){  .nav-dropdown{width:100%;}  .nav-dropdown__main{width:100%;padding:12px 0!important;}  .nav-drop er-radius:7px;padding:10px 15px;background:#001449;color:#fff;font-weight:700;cursor:pointer}.college-db__pagination button:disabled{opacity:.4;cursor:not-allowed}@media(max-width:700px){.college-db__filters{grid-template-columns:1fr}.college-db__panel{padding:15px}.college-db__meta{align-items:flex-start;flex-direction:column}} /* Social media icons in the top navigation */.nav__social{display:flex;align-items:center;gap:10px;margin-right:2px}.nav__social a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid rgba(255,255,255,.35);border-radius:50%;color:#fff;transition:background .2s ease,border-color .2s ease,transform .2s ease}.nav__social a:hover{background:var(--red);border-color:var(--red);transform:translateY(-2px)}.nav__social svg{width:19px;height:19px;display:block;fill:currentColor}@media(max-width:900px){.nav__social{margin-left:auto;margin-right:10px;gap:7px}.nav__social a{width:32px;height:32px}.nav__social svg{width:17px;height:17px}}

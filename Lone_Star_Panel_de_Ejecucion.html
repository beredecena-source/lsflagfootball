<style>
  :root{
    --navy:#002B59; --cyan:#00A9C7; --amber:#C9862B; --slate:#5F5E5A;
    --bg:#F7F8FA; --card:#FFFFFF; --line:#E3E6EA; --text:#1C2430; --muted:#6B7280;
    --done:#1D9E75; --wip:#00A9C7; --pend:#B4B2A9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181F; --card:#1B2028; --line:#2B313C; --text:#EDEFF2; --muted:#9AA1AC; }
  }
  *{box-sizing:border-box;}
  body,.app{font-family:-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);}
  .app{background:var(--bg);padding:0;}
  .scoreboard{background:var(--navy);border-radius:14px;padding:22px 24px;color:#fff;margin-bottom:18px;}
  .scoreboard-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
  .scoreboard h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.3px;}
  .scoreboard .sub{color:#B9D4E8;font-size:13px;margin-top:4px;}
  .bignum{font-size:34px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1;}
  .bignum-label{font-size:11px;color:#B9D4E8;text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
  .barwrap{background:rgba(255,255,255,.15);border-radius:8px;height:10px;margin-top:14px;overflow:hidden;}
  .barfill{background:var(--cyan);height:100%;border-radius:8px;transition:width .3s ease;}
  .next{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;}
  .next h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);margin:0 0 10px;}
  .next-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;}
  .next-item:first-child{border-top:none;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  select,input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--card);color:var(--text);}
  .cat{margin-bottom:16px;border:0.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;}
  .cat-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;}
  .cat-head h3{margin:0;font-size:14px;font-weight:600;}
  .cat-progress{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .cat-bar{width:70px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--done);}
  .cat-body{border-top:0.5px solid var(--line);}
  .task{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-top:0.5px solid var(--line);}
  .task:first-child{border-top:none;}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--pend);flex:0 0 auto;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .dot.en_progreso{border-color:var(--wip);background:var(--wip);}
  .dot.hecho{border-color:var(--done);background:var(--done);}
  .task-title{font-size:14px;line-height:1.4;}
  .task-title.hecho{text-decoration:line-through;color:var(--muted);}
  .task-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
  .pill-owner{background:#EAF0F7;color:var(--navy);}
  .pill-window{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
  .task-del{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;}
  .addrow{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--bg);}
  .addrow input[type=text]{flex:1;min-width:140px;}
  .addbtn,.addrow button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
  .addbtn:hover,.addrow button:hover{opacity:.9;}
  .note{font-size:12px;color:var(--muted);margin:4px 0 16px;}
  .empty{padding:16px;text-align:center;color:var(--muted);font-size:13px;}
</style>

<div class="app">
  <div class="scoreboard">
    <div class="scoreboard-top">
      <div>
        <h1>Lone Star Flag Football — panel de ejecución</h1>
        <div class="sub">Katy · Célula 1 · actualizado por los tres socios</div>
      </div>
      <div style="text-align:right">
        <div class="bignum" id="pct">0%</div>
        <div class="bignum-label" id="count">0 de 0 tareas</div>
      </div>
    </div>
    <div class="barwrap"><div class="barfill" id="mainbar" style="width:0%"></div></div>
  </div>

  <div class="next">
    <h2>Qué sigue</h2>
    <div id="nextlist"></div>
  </div>

  <div class="toolbar">
    <select id="fowner"></select>
    <select id="fstatus">
      <option value="todas">Todas las tareas</option>
      <option value="pendiente">Pendientes</option>
      <option value="en_progreso">En progreso</option>
      <option value="hecho">Hechas</option>
    </select>
  </div>

  <div id="cats"></div>
  <div class="note">Datos compartidos: lo que marque cualquiera de los tres se guarda para los otros dos en este panel.</div>
</div>

<script>
const OWNERS = ["Mario","Raúl","Juan Carlos","Los 3","Equipo"];
const SEED = [
  {cat:"Gobierno y capital", t:"Definir % individual Mario/Raúl dentro del 51% combinado", o:"Los 3", w:"Ago 2026"},
  {cat:"Gobierno y capital", t:"Redactar operating agreement (consentimiento unánime en decisiones mayores)", o:"Los 3", w:"Ago 2026"},
  {cat:"Gobierno y capital", t:"Confirmar estructura HoldCo + OpCo + PropCo con abogado corporativo", o:"Juan Carlos", w:"Ago–Sept 2026"},
  {cat:"Gobierno y capital", t:"Revisar y ajustar supuestos del modelo de cascada de capitalización", o:"Los 3", w:"Ago 2026"},
  {cat:"Gobierno y capital", t:"Definir política de retención de utilidades (% distribuido vs. retenido)", o:"Los 3", w:"Ago 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Solicitar campos con Katy ISD", o:"Juan Carlos", w:"Ago 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Escalar conversación hacia Partners in Education", o:"Juan Carlos", w:"Ago 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Contratar coordinador de sede (medio tiempo)", o:"Juan Carlos", w:"Sept 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Contratar 1–2 entrenadores", o:"Juan Carlos", w:"Sept–Oct 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Configurar SportsEngine con etiqueta 'Katy' y precio de temporada", o:"Equipo", w:"Sept–Oct 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Configurar Mailchimp/SimpleTexting para Katy", o:"Equipo", w:"Sept–Oct 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Cotizar seguro de responsabilidad civil y accidentes", o:"Juan Carlos", w:"Sept 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Diseñar y correr clínica gratuita de lanzamiento", o:"Equipo", w:"Nov–Dic 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Abrir inscripción de pago", o:"Equipo", w:"Nov–Dic 2026"},
  {cat:"Piloto Katy — Etapa A", t:"Ejecutar temporada piloto de 8 semanas", o:"Equipo", w:"Ene–Mar 2027"},
  {cat:"Piloto Katy — Etapa A", t:"Medir resultados del piloto (inscripciones, retención, relación Katy ISD)", o:"Juan Carlos", w:"Abr 2027"},
  {cat:"Financiamiento", t:"Contacto exploratorio con 1–2 CDCs de Houston (H-GALDC, Community CDC)", o:"Juan Carlos", w:"30 días"},
  {cat:"Financiamiento", t:"Rehacer modelo financiero de 'Célula 1 — Arena propia' con datos reales", o:"Equipo", w:"Abr–May 2027"},
  {cat:"Bienes raíces", t:"Iniciar due diligence de bienes raíces en el Corredor Norte", o:"Equipo", w:"En curso"},
  {cat:"Bienes raíces", t:"Definir filtro de terreno (5–6 acres) para broker en Katy", o:"Equipo", w:"Al activar Etapa B"},
  {cat:"Escalamiento", t:"Definir gatillos formales de lanzamiento de Célula 2", o:"Los 3", w:"Sept 2026"},
  {cat:"Escalamiento", t:"Identificar candidato a coordinador de sede — Corredor Norte", o:"Juan Carlos", w:"2027"},
  {cat:"Escalamiento", t:"Programar revisión trimestral de KPIs entre los 3 socios", o:"Los 3", w:"Recurrente"},
];

let tasks = [];
let filterOwner = "todas";
let filterStatus = "todas";

function uid(){ return 't' + Math.random().toString(36).slice(2,10); }

async function loadTasks(){
  try{
    const res = await window.storage.get('tasks', true);
    tasks = res ? JSON.parse(res.value) : null;
  }catch(e){ tasks = null; }
  if(!tasks || !tasks.length){
    tasks = SEED.map(s => ({id:uid(), categoria:s.cat, titulo:s.t, dueño:s.o, ventana:s.w, estado:'pendiente'}));
    await saveTasks();
  }
  render();
}

async function saveTasks(){
  try{
    await window.storage.set('tasks', JSON.stringify(tasks), true);
  }catch(e){ console.error('No se pudo guardar', e); }
}

function cycleStatus(s){
  return s === 'pendiente' ? 'en_progreso' : (s === 'en_progreso' ? 'hecho' : 'pendiente');
}

function render(){
  const ownerSel = document.getElementById('fowner');
  ownerSel.innerHTML = '<option value="todas">Todos</option>' + OWNERS.map(o=>`<option value="${o}">${o}</option>`).join('');
  ownerSel.value = filterOwner;

  const total = tasks.length;
  const done = tasks.filter(t=>t.estado==='hecho').length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('count').textContent = done + ' de ' + total + ' tareas';
  document.getElementById('mainbar').style.width = pct + '%';

  const next = tasks.filter(t=>t.estado!=='hecho').slice(0,5);
  const nextEl = document.getElementById('nextlist');
  nextEl.innerHTML = next.length ? next.map(t=>`
    <div class="next-item">
      <span class="dot ${t.estado}" onclick="toggle('${t.id}')"></span>
      <span>${t.titulo} <span class="pill pill-window" style="margin-left:6px">${t.ventana}</span></span>
    </div>`).join('') : '<div class="empty">Todo al día — no hay tareas pendientes.</div>';

  const cats = [...new Set(tasks.map(t=>t.categoria))];
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = cats.map(cat=>{
    const items = tasks.filter(t=>t.categoria===cat)
      .filter(t=> filterOwner==='todas' || t.dueño===filterOwner)
      .filter(t=> filterStatus==='todas' || t.estado===filterStatus);
    const allInCat = tasks.filter(t=>t.categoria===cat);
    const catDone = allInCat.filter(t=>t.estado==='hecho').length;
    const catPct = allInCat.length ? Math.round(catDone/allInCat.length*100) : 0;
    return `
      <div class="cat">
        <div class="cat-head">
          <h3>${cat}</h3>
          <div class="cat-progress">${catDone}/${allInCat.length}
            <div class="cat-bar"><div class="cat-bar-fill" style="width:${catPct}%"></div></div>
          </div>
        </div>
        <div class="cat-body">
          ${items.length ? items.map(t=>`
            <div class="task">
              <span class="dot ${t.estado}" onclick="toggle('${t.id}')" title="Cambiar estado"></span>
              <div style="flex:1">
                <div class="task-title ${t.estado==='hecho'?'hecho':''}">${t.titulo}</div>
                <div class="task-meta">
                  <span class="pill pill-owner">${t.dueño}</span>
                  <span class="pill pill-window">${t.ventana}</span>
                </div>
              </div>
              <button class="task-del" onclick="removeTask('${t.id}')" aria-label="Eliminar tarea">×</button>
            </div>`).join('') : '<div class="empty">Sin tareas con este filtro.</div>'}
          <div class="addrow">
            <input type="text" placeholder="Nueva tarea en ${cat}..." id="new-${cat.replace(/[^a-zA-Z0-9]/g,'')}">
            <button onclick="addTask('${cat}')">Agregar</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function toggle(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.estado = cycleStatus(t.estado);
  await saveTasks();
  render();
}

async function removeTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  await saveTasks();
  render();
}

async function addTask(cat){
  const input = document.getElementById('new-'+cat.replace(/[^a-zA-Z0-9]/g,''));
  const val = input.value.trim();
  if(!val) return;
  tasks.push({id:uid(), categoria:cat, titulo:val, dueño:'Equipo', ventana:'Sin definir', estado:'pendiente'});
  input.value = '';
  await saveTasks();
  render();
}

document.getElementById('fowner').addEventListener('change', e=>{ filterOwner = e.target.value; render(); });
document.getElementById('fstatus').addEventListener('change', e=>{ filterStatus = e.target.value; render(); });

loadTasks();
</script>
